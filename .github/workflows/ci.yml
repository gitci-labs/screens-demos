name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: screens-demos
      - uses: actions/checkout@v6
        with:
          repository: gitci-labs/screens
          path: screens-tool
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: screens-tool/js/pnpm-lock.yaml
      - run: cd screens-tool/js && pnpm install --frozen-lockfile
      - run: cd screens-tool/js && pnpm build
      - run: cd screens-tool/js && pnpm --filter @gitci/screens-renderer-node exec playwright install --with-deps chromium
      - run: cd screens-tool && swift build
      - run: |
          for demo in minimal todo-basic pro-mac-app; do
            ./screens-tool/.build/debug/gitci-screens validate "screens-demos/demos/$demo" --strict
          done
          ./screens-tool/.build/debug/gitci-screens validate "screens-demos/demos/reader-immersive" --strict --all-variant-groups
        env:
          GITCI_SCREENS_JS_WORKSPACE: ${{ github.workspace }}/screens-tool/js
          GITCI_SCREENS_TEMPLATES_ROOT: ${{ github.workspace }}/screens-tool/templates/gitci/screens
      - run: |
          for demo in minimal todo-basic pro-mac-app; do
            ./screens-tool/.build/debug/gitci-screens export "screens-demos/demos/$demo" --strict
          done
          ./screens-tool/.build/debug/gitci-screens export "screens-demos/demos/reader-immersive" --strict --fastlane-out fastlane/screenshots
          ./screens-tool/.build/debug/gitci-screens export "screens-demos/demos/reader-immersive" --strict --all-variant-groups --skip-archive --skip-gallery
        env:
          GITCI_SCREENS_JS_WORKSPACE: ${{ github.workspace }}/screens-tool/js
          GITCI_SCREENS_TEMPLATES_ROOT: ${{ github.workspace }}/screens-tool/templates/gitci/screens
      - run: test -f screens-demos/demos/minimal/gitci/screens/build/launch/appstore.iphone.6_9.portrait/01-hero.png
      - run: test -f screens-demos/demos/minimal/gitci/screens/build/launch/appstore.iphone.6_9.portrait/04-span-2.png
      - run: test -f screens-demos/demos/minimal/gitci/screens/build/launch/appstore.ipad.13.portrait/04-span-2.png
      - run: test -f screens-demos/demos/minimal/gitci/screens/build/launch/appstore.mac.16_10/03-span.png
      - run: test -f screens-demos/demos/todo-basic/gitci/screens/build/launch/appstore.iphone.6_9.portrait/01-capture.png
      - run: test -f screens-demos/demos/reader-immersive/gitci/screens/build/launch/en-US/appstore.ipad.13.portrait/01-read.png
      - run: test -f screens-demos/demos/reader-immersive/gitci/screens/build/launch/ja-JP/appstore.iphone.6_9.portrait/01-read.png
      - run: test -f screens-demos/demos/reader-immersive/gitci/screens/build/launch/ppo-a/en-US/appstore.iphone.6_9.portrait/01-read.png
      - run: test -f screens-demos/demos/reader-immersive/fastlane/screenshots/ja-JP/01-appstore-iphone-6_9-portrait-read-iphone.png
      - run: test -f screens-demos/demos/pro-mac-app/gitci/screens/build/launch/appstore.mac.16_10/01-workspace.png
      - run: test -f screens-demos/demos/todo-basic/gitci/screens/build/launch/gallery/index.html
      - run: test -f screens-demos/demos/reader-immersive/gitci/screens/build/launch.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screens-demo-builds
          path: screens-demos/demos/*/gitci/screens/build/launch.zip
          retention-days: 14
