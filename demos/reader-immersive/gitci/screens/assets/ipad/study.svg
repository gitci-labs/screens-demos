  <text x="116" y="170" fill="#1C1917" font-family="Georgia, serif" font-size="48" font-weight="700">Chapter Notes</text>
  <g fill="#57534E" font-family="Georgia, serif" font-size="30">
    <text x="116" y="260">Reading should stay fluid,</text>
    <text x="116" y="316">even when the material is</text>
    <text x="116" y="372">dense and unfamiliar.</text>
    <text x="116" y="492">Highlights become cards,</text>
    <text x="116" y="548">and cards keep their source.</text>
