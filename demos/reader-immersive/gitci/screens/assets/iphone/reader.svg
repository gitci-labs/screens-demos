<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" rx="44" fill="#FFFBEB"/>
  <text x="34" y="86" fill="#1C1917" font-family="Georgia, serif" font-size="30" font-weight="700">Evening Read</text>
  <rect x="34" y="124" width="322" height="520" rx="28" fill="#FFFFFF"/>
  <g fill="#44403C" font-family="Georgia, serif" font-size="21">
    <text x="60" y="188">The city lights settled into</text>
    <text x="60" y="228">the river while the last train</text>
    <text x="60" y="268">crossed the bridge.</text>
    <text x="60" y="348">A saved word becomes easier</text>
    <text x="60" y="388">to meet the next time.</text>
  </g>
  <rect x="54" y="294" width="184" height="38" rx="19" fill="#FEE2E2"/>
  <text x="72" y="320" fill="#B91C1C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">bridge</text>
  <rect x="34" y="676" width="322" height="84" rx="26" fill="#1C1917"/>
  <text x="62" y="728" fill="#FED7AA" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Saved to review</text>
</svg>
